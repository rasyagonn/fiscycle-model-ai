name: Build AI Service untuk Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/build-ai-service.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-ai-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Tetapkan nama image dan versi commit
        run: |
          echo "IMAGE=ca9edb09a3d8acr.azurecr.io/fiscycle-ai-service:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Uji retry startup
        run: python3 -m unittest discover -s ai-service/tests -p test_container_startup.py -v

      - name: Build image Linux dengan model lokal
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" ai-service

      - name: Uji container dan inferensi nyata sebelum publish
        run: python3 ai-service/tools/verify_container.py --image "$IMAGE"

      - name: Login Azure dengan identitas khusus build
        uses: azure/login@v3.1.0
        with:
          # Public resource identifiers, not credentials. Federation trusts main only.
          client-id: 52993a93-cdbe-4a19-a2fd-c0605322b02c
          tenant-id: 1d5169ac-c7cb-4275-9764-bf8c9c364a4c
          subscription-id: 4086d2a4-2376-47f3-9916-0bbce28c7e2d

      - name: Login registry Azure yang sudah ada
        run: az acr login --name ca9edb09a3d8acr

      - name: Publish image yang lolos pengujian
        run: docker push "$IMAGE"

      - name: Tampilkan hasil untuk langkah Azure berikutnya
        run: |
          {
            echo '### Image siap untuk dicoba di Azure'
            echo "Image: \`$IMAGE\`"
            echo 'Model lokal dan 16 foto demo disertakan. Tidak ada seed Water privat atau secret deployment.'
            echo 'Tes numerik/replay Water yang memerlukan fixture privat di-skip secara eksplisit.'
            echo 'Image berada di ACR privat; runtime memakai managed identity dengan AcrPull.'
            echo 'Workflow ini belum membuat resource atau endpoint Azure.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hapus credential registry pada runner
        if: always()
        run: docker logout ca9edb09a3d8acr.azurecr.io || true
